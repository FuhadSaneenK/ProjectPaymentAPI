<app-modal 
  [isOpen]="isOpen" 
  title="Make Payment"
  subtitle="Process a payment from this account."
  (closeModal)="onClose()">
  
  <form (ngSubmit)="onSubmit()" class="payment-form">
    <div class="form-group">
      <label for="amount" class="form-label">
        Amount <span class="required">*</span>
      </label>
      <div class="input-wrapper">
        <span class="input-icon">$</span>
        <input 
          type="number" 
          id="amount"
          name="amount"
          [(ngModel)]="amount"
          class="form-input"
          placeholder="0.00"
          step="0.01"
          min="0.01"
          required
          [disabled]="isSubmitting">
      </div>
    </div>

    <div class="form-group">
      <label for="paymentMethodId" class="form-label">
        Payment Method <span class="required">*</span>
      </label>
      <select 
        id="paymentMethodId"
        name="paymentMethodId"
        [(ngModel)]="paymentMethodId"
        class="form-select"
        required
        [disabled]="isSubmitting">
        <option value="" disabled selected>Select payment method</option>
        <option *ngFor="let method of paymentMethods" [value]="method.id">
          {{ method.name }}{{ method.description ? ' - ' + method.description : '' }}
        </option>
      </select>
    </div>

    <div class="info-box">
      <i class="fa-solid fa-circle-info"></i>
      <div>
        <p class="info-title">Payment Information</p>
        <p class="info-text">Account: <strong>{{ accountId }}</strong></p>
        <p class="info-text" *ngIf="accountHolderName">Holder: <strong>{{ accountHolderName }}</strong></p>
      </div>
    </div>

    <div class="modal-actions">
      <button 
        type="button" 
        class="btn btn-secondary" 
        (click)="onClose()"
        [disabled]="isSubmitting">
        Cancel
      </button>
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="!isValid() || isSubmitting">
        <span *ngIf="!isSubmitting">Make Payment</span>
        <span *ngIf="isSubmitting">
          <i class="fa-solid fa-spinner fa-spin"></i> Processing...
        </span>
      </button>
    </div>
  </form>
</app-modal>
